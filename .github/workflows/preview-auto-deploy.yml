name: Preview automatic deploy

on:
  workflow_run:
    workflows: [Docker]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    concurrency:
      group: veiculando-preview
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: image
        name: Resolve immutable BFF image
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          : "${ACR:?Configure ACR_LOGIN_SERVER in repository variables}"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          digest="$(az acr manifest show-metadata --registry "${ACR%%.*}" --name "veiculando-whitelabel-api:sha-$SHA" --query digest --output tsv)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=$ACR/veiculando-whitelabel-api@$digest" >> "$GITHUB_OUTPUT"
      - name: Update preview BFF and verify the public host
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
          HOST: ${{ vars.PREVIEW_APP_HOST }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          : "${RESOURCE_GROUP:?Configure AZURE_RESOURCE_GROUP in repository variables}"
          : "${VM_NAME:?Configure AZURE_VM_NAME in repository variables}"
          : "${HOST:?Configure PREVIEW_APP_HOST in repository variables}"
          remote_script=$(cat <<'SCRIPT'
          # Azure Run Command invokes RunShellScript with /bin/sh, which does
          # not support the Bash-only constructs below (pipefail, arrays,
          # [[ ... ]]). Re-exec ourselves before doing any deployment work.
          if [ -z "${BASH_VERSION:-}" ]; then exec /usr/bin/env bash "$0" "$@"; fi
          set -euo pipefail
          image_ref="${1#IMAGE_REF=}"
          host="${2#HOST=}"
          registry="${image_ref%%/*}"
          metadata='http://169.254.169.254/metadata/identity/oauth2/token?api-version=2019-08-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'
          identity_response=$(curl --fail --silent --show-error --retry 3 -H Metadata:true "$metadata")
          identity_token=$(printf '%s' "$identity_response" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          exchange_response=$(curl --fail --silent --show-error --retry 3 --data-urlencode "access_token=$identity_token" --data 'grant_type=access_token' --data "service=$registry" "https://$registry/oauth2/exchange")
          refresh_token=$(printf '%s' "$exchange_response" | sed -n 's/.*"refresh_token":"\([^"]*\)".*/\1/p')
          [[ -n "$refresh_token" ]]
          printf '%s' "$refresh_token" | docker login "$registry" --username 00000000-0000-0000-0000-000000000000 --password-stdin >/dev/null
          stack=/opt/veiculando/preview
          mkdir -p "$stack"
          exec 9>"$stack/deploy.lock"
          flock -w 900 9
          env_file="$stack/stack.env"
          compose=(docker compose --project-name veiculando-preview --env-file "$env_file" -f "$stack/docker-compose.yml")
          [[ "$image_ref" =~ ^.+@sha256:[a-f0-9]{64}$ && "$host" =~ ^[A-Za-z0-9.-]+$ ]] || exit 64
          [[ -f "$env_file" ]] || { echo 'preview stack.env ausente' >&2; exit 66; }
          backup=$(mktemp); cp -a "$env_file" "$backup"; deployed=0
          rollback() { if [[ "$deployed" != 1 ]]; then cp -a "$backup" "$env_file"; "${compose[@]}" up -d --pull never --no-deps --force-recreate bff edge || true; echo PREVIEW_ROLLBACK=executed >&2; fi; rm -f "$backup"; }
          trap rollback EXIT
          awk -v value="$image_ref" 'index($0,"BFF_IMAGE=")==1 { print "BFF_IMAGE=" value; found=1; next } { print } END { if (!found) print "BFF_IMAGE=" value }' "$env_file" > "$env_file.new"
          chmod --reference="$env_file" "$env_file.new"; chown --reference="$env_file" "$env_file.new"; mv "$env_file.new" "$env_file"
          "${compose[@]}" config --quiet
          "${compose[@]}" pull bff
          "${compose[@]}" up -d --pull never --no-deps --force-recreate bff edge
          for _ in $(seq 1 30); do
            if docker inspect --format '{{.State.Running}}' veiculando-preview-bff-1 | grep -qx true && docker exec veiculando-preview-bff-1 curl --fail --silent --show-error http://localhost:8080/health >/dev/null && curl --fail --silent --show-error -H "Host: $host" http://127.0.0.1:9080/ | grep -q '<app-root'; then deployed=1; echo PREVIEW_SMOKE=success; exit 0; fi
            sleep 2
          done
          exit 1
          SCRIPT
          )
          result="$(az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --parameters "IMAGE_REF=$IMAGE_REF" "HOST=$HOST" --scripts "$remote_script" --output json)"
          printf '%s\n' "$result"
          # The Run Command control plane can report its invocation as enabled
          # even when the guest script emitted an error. Require the marker
          # printed only after the new container passes the host smoke test.
          grep -Fq 'PREVIEW_SMOKE=success' <<< "$result"
