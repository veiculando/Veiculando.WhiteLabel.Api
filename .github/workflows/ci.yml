name: CI

# Chamador do workflow reutilizavel mantido em veiculando/.github.
#
# app-dir e core-dir sao irmaos por exigencia do csproj: os ProjectReference
# apontam para ..\Veiculando\, entao o core precisa estar num diretorio com esse
# nome exato ao lado deste repositorio.

on:
  pull_request:
  push:
    branches:
      - master
      - 'sprint-*'

jobs:
  dotnet:
    uses: veiculando/.github/.github/workflows/_dotnet-ci.yml@main
    with:
      app-dir: Veiculando.WhiteLabel.Api
      core-dir: Veiculando
      test-project: Veiculando.WhiteLabel.Api.Tests/Veiculando.WhiteLabel.Api.Tests.csproj
    secrets:
      core-repo-token: ${{ secrets.CORE_REPO_TOKEN }}
