name: Docker

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .dockerignore
      - .trivyignore
      - core.ref
      - '**/*.cs'
      - '**/*.csproj'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    uses: veiculando/.github/.github/workflows/_docker-build-push.yml@main
    with:
      image-name: veiculando-whitelabel-api
      source-dir: Veiculando.WhiteLabel.Api
      dockerfile: Dockerfile
      needs-core: true
      acr-login-server: ${{ vars.ACR_LOGIN_SERVER }}
    secrets:
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      core-repo-token: ${{ secrets.CORE_REPO_TOKEN }}

